<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1360" viewBox="0 0 1180 1360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .layer  { rx:12; ry:12; stroke-width:2; }
      .title  { font-size:19px; font-weight:700; fill:#0f172a; }
      .sub    { font-size:13px; fill:#475569; }
      .code   { font-family:Consolas,Menlo,monospace; font-size:13px; fill:#0f172a; }
      .num    { font-size:15px; font-weight:700; fill:#fff; }
      .step   { fill:#1e293b; }
      .data   { font-family:Consolas,Menlo,monospace; font-size:12px; fill:#065f46; }
      .obj    { font-size:12px; font-weight:700; fill:#7c2d12; }
      .flow   { stroke:#334155; stroke-width:2; fill:none; }
    </style>
  </defs>

  <rect width="1180" height="1360" fill="#f8fafc"/>
  <text x="40" y="46" class="title" font-size="26">POST /api/auth/register — end-to-end flow</text>
  <text x="40" y="72" class="sub" font-size="15">What happens from the moment the user hits "Sign up" to the 201 response. Boxes = layers · green = data · brown = objects.</text>

  <!-- vertical spine -->
  <line x1="90" y1="130" x2="90" y2="1290" class="flow"/>

  <!-- helper: step circles -->
  <!-- STEP 1 CLIENT -->
  <circle cx="90" cy="165" r="18" class="step"/><text x="90" y="171" text-anchor="middle" class="num">1</text>
  <rect x="130" y="120" width="620" height="120" class="layer" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="150" y="150" class="title">Client (browser)</text>
  <text x="150" y="176" class="sub">User fills the sign-up form and submits. Browser sends JSON:</text>
  <rect x="150" y="188" width="580" height="42" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="162" y="205" class="data">{ "fullName":"Asha R", "email":"asha@corp.com",</text>
  <text x="162" y="223" class="data">  "username":"asha", "password":"secret123", "department":"IT" }</text>
  <text x="790" y="185" class="obj">JSON body ─▶</text>

  <!-- STEP 2 SECURITY -->
  <circle cx="90" cy="300" r="18" class="step"/><text x="90" y="306" text-anchor="middle" class="num">2</text>
  <rect x="130" y="262" width="620" height="86" class="layer" fill="#fef2f2" stroke="#ef4444"/>
  <text x="150" y="292" class="title">SecurityConfig + JwtAuthFilter</text>
  <text x="150" y="316" class="sub"><tspan class="code">/api/auth/**</tspan> is public → no token required, filter lets it pass through.</text>
  <text x="150" y="336" class="sub">Request reaches the controller unauthenticated. ✅</text>

  <!-- STEP 3 CONTROLLER -->
  <circle cx="90" cy="430" r="18" class="step"/><text x="90" y="436" text-anchor="middle" class="num">3</text>
  <rect x="130" y="372" width="620" height="150" class="layer" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="150" y="402" class="title">AuthController.register(...)</text>
  <text x="150" y="424" class="code">@Valid @RequestBody RegisterRequest req</text>
  <text x="150" y="446" class="sub">Jackson maps JSON → <tspan class="code">RegisterRequest</tspan> record. @Valid runs:</text>
  <text x="150" y="466" class="sub">@NotBlank on all, @Email on email. Fails → 400 (GlobalExceptionHandler).</text>
  <text x="150" y="490" class="sub">Builds a <tspan class="code">User</tspan> object, copies fields, sets role = EMPLOYEE.</text>
  <text x="150" y="510" class="sub">Then calls the service ↓</text>
  <text x="790" y="430" class="obj">▸ RegisterRequest (DTO)</text>
  <text x="790" y="452" class="obj">▸ new User() (entity)</text>

  <!-- STEP 4 SERVICE user -->
  <circle cx="90" cy="600" r="18" class="step"/><text x="90" y="606" text-anchor="middle" class="num">4</text>
  <rect x="130" y="546" width="620" height="176" class="layer" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="150" y="576" class="title">UserService.registerUser(user, password)</text>
  <text x="150" y="600" class="code">repository.existsByUsername(username)  → false (ok)</text>
  <text x="150" y="622" class="code">repository.existsByEmail(email)        → false (ok)</text>
  <text x="150" y="646" class="sub">Either true → throws <tspan class="code">DuplicateResourceException</tspan> → 409.</text>
  <text x="150" y="670" class="code">passwordEncoder.encode(raw) → BCrypt hash</text>
  <text x="150" y="694" class="code">repository.save(user)  →  INSERT into users</text>
  <text x="150" y="714" class="sub">Returns saved User (now has an id).</text>

  <!-- DB 1 -->
  <rect x="850" y="560" width="290" height="150" class="layer" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="870" y="588" class="title" font-size="16">Database</text>
  <text x="870" y="612" class="sub">users table</text>
  <rect x="870" y="624" width="250" height="70" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="882" y="644" class="data">id | username | email</text>
  <text x="882" y="662" class="data">passwordHash (bcrypt)</text>
  <text x="882" y="680" class="data">role=EMPLOYEE | dept</text>

  <!-- STEP 5 REFRESH -->
  <circle cx="90" cy="800" r="18" class="step"/><text x="90" y="806" text-anchor="middle" class="num">5</text>
  <rect x="130" y="746" width="620" height="140" class="layer" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="150" y="776" class="title">RefreshTokenService.create(username)</text>
  <text x="150" y="800" class="code">new RefreshToken()</text>
  <text x="150" y="822" class="code">token = UUID.randomUUID()  ·  expiresAt = now + TTL</text>
  <text x="150" y="846" class="code">repository.save(rt) → INSERT into refresh_tokens</text>
  <text x="150" y="868" class="sub">A random opaque token tied to the user, stored server-side.</text>

  <!-- DB 2 -->
  <rect x="850" y="760" width="290" height="110" class="layer" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="870" y="788" class="title" font-size="16">Database</text>
  <text x="870" y="812" class="sub">refresh_tokens table</text>
  <rect x="870" y="824" width="250" height="34" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="882" y="846" class="data">token(UUID) | username | exp</text>

  <!-- STEP 6 AUTHRESPONSE -->
  <circle cx="90" cy="970" r="18" class="step"/><text x="90" y="976" text-anchor="middle" class="num">6</text>
  <rect x="130" y="910" width="620" height="176" class="layer" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="150" y="940" class="title">authResponse(user, refresh, 201) — shared helper</text>
  <text x="150" y="964" class="code">jwtUtil.generateToken(username, role)</text>
  <text x="150" y="984" class="sub">Builds a signed JWT: subject=username, claim role, exp, HMAC-signed.</text>
  <text x="150" y="1008" class="code">ResponseCookie refreshToken — httpOnly, path=/api/auth</text>
  <text x="150" y="1028" class="sub">Refresh token goes in a cookie JS can't read (XSS-safe).</text>
  <text x="150" y="1052" class="code">new AuthResponse(accessToken, username, role)</text>
  <text x="150" y="1072" class="sub">Access token goes in the JSON body.</text>
  <text x="790" y="960" class="obj">▸ JwtUtil</text>
  <text x="790" y="982" class="obj">▸ ResponseCookie</text>
  <text x="790" y="1004" class="obj">▸ AuthResponse (DTO)</text>

  <!-- STEP 7 RESPONSE -->
  <circle cx="90" cy="1180" r="18" class="step"/><text x="90" y="1186" text-anchor="middle" class="num">7</text>
  <rect x="130" y="1110" width="1010" height="150" class="layer" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="150" y="1140" class="title">Response → Client   (HTTP 201 Created)</text>
  <rect x="150" y="1152" width="470" height="44" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="162" y="1170" class="data">Body: { "accessToken":"eyJhbGc...",</text>
  <text x="162" y="1188" class="data">        "username":"asha", "role":"EMPLOYEE" }</text>
  <rect x="640" y="1152" width="480" height="44" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="652" y="1170" class="data">Set-Cookie: refreshToken=&lt;uuid&gt;;</text>
  <text x="652" y="1188" class="data">   HttpOnly; Path=/api/auth; SameSite=Lax</text>
  <text x="150" y="1230" class="sub">User is now registered AND logged in: access token in hand, refresh cookie stored by the browser. ✅</text>

  <!-- flow arrows between steps -->
  <line x1="90" y1="183" x2="90" y2="282" class="flow" marker-end="url(#arrow)"/>
  <line x1="90" y1="318" x2="90" y2="412" class="flow" marker-end="url(#arrow)"/>
  <line x1="90" y1="448" x2="90" y2="582" class="flow" marker-end="url(#arrow)"/>
  <line x1="90" y1="618" x2="90" y2="782" class="flow" marker-end="url(#arrow)"/>
  <line x1="90" y1="818" x2="90" y2="952" class="flow" marker-end="url(#arrow)"/>
  <line x1="90" y1="988" x2="90" y2="1162" class="flow" marker-end="url(#arrow)"/>
</svg>
