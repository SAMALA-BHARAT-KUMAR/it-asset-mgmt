# Monorepo: 3 services in one repo. Runner is a SHELL executor (runs jobs
# directly on the runner host's bash) — so `image:`/`services:` are ignored and
# tools must exist on the host. We use the committed ./mvnw wrapper (needs only
# a JDK, self-installs Maven). Each service builds only when ITS files change.
stages: [build, image]

variables:
  # absolute repo-local Maven cache so `cd $SERVICE` doesn't misplace it
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# ---------- templates ----------
.build:
  stage: build
  cache:
    key: maven
    paths: [.m2/repository]
  # Shell runner doesn't export JAVA_HOME. Resolve it: valid $JAVA_HOME →
  # java on PATH → common JVM install dirs. Fail loudly if the host has no JDK.
  before_script:
    - |
      if [ -z "$JAVA_HOME" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
        if command -v java >/dev/null 2>&1; then
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
        else
          for d in /usr/lib/jvm/*21* /usr/lib/jvm/java-21* /usr/lib/jvm/default-java /opt/java*; do
            [ -x "$d/bin/java" ] && export JAVA_HOME="$d" && break
          done
        fi
      fi
      [ -x "$JAVA_HOME/bin/java" ] || { echo "ERROR: no JDK 21 on runner host $(hostname). Install one or set JAVA_HOME."; exit 1; }
      export PATH="$JAVA_HOME/bin:$PATH"
      echo "Using JAVA_HOME=$JAVA_HOME"; java -version
  # ponytail: -DskipTests — shell runner has no Postgres and assetservice tests
  # need a real DB. Add a DB-backed test job (Testcontainers / service Postgres
  # on a Docker runner) when one is available.
  script:
    - cd $SERVICE && ./mvnw -B -DskipTests package
  artifacts:
    paths: [$SERVICE/target/*.jar]
    expire_in: 1 week

.image:
  stage: image
  # ponytail: uses the host's docker (shell runner). Needs docker installed on
  # the runner host + registry login. Move to a docker/kaniko runner if absent.
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/$SERVICE:latest ./$SERVICE
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:latest

# ---------- assetservice ----------
build:assetservice:
  extends: .build
  variables: {SERVICE: assetservice}
  rules:
    - changes: [assetservice/**/*, .gitlab-ci.yml]
image:assetservice:
  extends: .image
  variables: {SERVICE: assetservice}
  needs: ["build:assetservice"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [assetservice/**/*, .gitlab-ci.yml]

# ---------- discovery-server ----------
build:discovery-server:
  extends: .build
  variables: {SERVICE: discovery-server}
  rules:
    - changes: [discovery-server/**/*, .gitlab-ci.yml]
image:discovery-server:
  extends: .image
  variables: {SERVICE: discovery-server}
  needs: ["build:discovery-server"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [discovery-server/**/*, .gitlab-ci.yml]

# ---------- config-server ----------
build:config-server:
  extends: .build
  variables: {SERVICE: config-server}
  rules:
    - changes: [config-server/**/*, .gitlab-ci.yml]
image:config-server:
  extends: .image
  variables: {SERVICE: config-server}
  needs: ["build:config-server"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [config-server/**/*, .gitlab-ci.yml]
