# Monorepo, 5 services. House pattern (see volpay/vigilant): Maven runs INSIDE
# each Dockerfile, so the runner only needs docker — no JDK/Maven on the host.
# Each service builds+pushes only when ITS files change. Images go to Harbor.
#
# ONE job per service: build, login, push all in the same job on the same runner,
# so the built image never has to survive a hop between jobs/runners.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

stages: [deploy]

variables:
  DOCKER_BUILDKIT: "1"
  HARBOR_URL: "harbor.neusix.ai"        # not a secret — hardcoded so it's never empty
  # Only HARBOR_USERNAME + HARBOR_PASSWORD come from GitLab CI variables (secrets).

.deploy:
  stage: deploy
  variables:
    IMAGE: "$HARBOR_URL/micro-services/$SERVICE"
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" ./$SERVICE
    # Robot name in SINGLE quotes so bash keeps the literal '$' (as a GitLab
    # variable the '$' gets expanded and corrupts the name). Password is a secret var.
    - echo "$HARBOR_PASSWORD" | docker login -u 'robot$micro-services+it-asset-management-git' --password-stdin "$HARBOR_URL"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"

discovery-server:
  extends: .deploy
  variables: {SERVICE: discovery-server}
  rules:
    - changes: [discovery-server/**/*, .gitlab-ci.yml]

config-server:
  extends: .deploy
  variables: {SERVICE: config-server}
  rules:
    - changes: [config-server/**/*, .gitlab-ci.yml]

user-auth-service:
  extends: .deploy
  variables: {SERVICE: user-auth-service}
  rules:
    - changes: [user-auth-service/**/*, .gitlab-ci.yml]

assetservice:
  extends: .deploy
  variables: {SERVICE: assetservice}
  rules:
    - changes: [assetservice/**/*, .gitlab-ci.yml]

gateway:
  extends: .deploy
  variables: {SERVICE: gateway}
  rules:
    - changes: [gateway/**/*, .gitlab-ci.yml]
