# Monorepo, 3 services. House pattern (see volpay/vigilant): Maven runs INSIDE
# each Dockerfile, so the runner only needs docker — no JDK/Maven on the host.
# Each service builds+pushes only when ITS files change. Images go to Harbor.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

stages: [build]

variables:
  DOCKER_BUILDKIT: "1"
  # HARBOR_URL / HARBOR_USERNAME / HARBOR_PASSWORD come from GitLab CI variables
  # (likely group-inherited). Harbor project "micro-services" is hardcoded below.

.buildpush:
  stage: build
  variables:
    IMAGE: "$HARBOR_URL/micro-services/$SERVICE"
  before_script:
    - docker info
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_URL"
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" ./$SERVICE
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"

buildpush:assetservice:
  extends: .buildpush
  variables: {SERVICE: assetservice}
  rules:
    - changes: [assetservice/**/*, .gitlab-ci.yml]

buildpush:discovery-server:
  extends: .buildpush
  variables: {SERVICE: discovery-server}
  rules:
    - changes: [discovery-server/**/*, .gitlab-ci.yml]

buildpush:config-server:
  extends: .buildpush
  variables: {SERVICE: config-server}
  rules:
    - changes: [config-server/**/*, .gitlab-ci.yml]
