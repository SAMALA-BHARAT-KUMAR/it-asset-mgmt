spring:
  application:
    name: gateway                    # config-server serves config/gateway.yml under this name
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true                # Day 30 prod-grade: don't boot half-configured
      retry:
        max-attempts: 6

# server.port and eureka come from config-server (config/gateway.yml + shared application.yml)
# Routes also live in config-server (config/gateway.yml), so they change without rebuilding the gateway.
